<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWIN · Плоттер</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#000000;color:#e8e8e8}
*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1240px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:24px;font-weight:600;margin:0}p{font-size:14px;color:#a0a0a0;margin:8px 0}
button{font:inherit;color:inherit;background:#000000;border:1px solid #303030;border-radius:8px;padding:10px 14px;cursor:pointer}
button:hover{border-color:#717a87}button:focus-visible{outline:2px solid #d0d0d0;outline-offset:2px}
#workspace{display:grid;grid-template-columns:minmax(0,900px) 190px;gap:24px;align-items:start}
#panel{position:relative;width:100%;aspect-ratio:5/3;background:#000000;overflow:hidden;border-radius:12px;border:1px solid #303030;box-shadow:0 12px 60px #0004}
canvas{display:block;width:100%;height:100%}#hotspots{position:absolute;inset:0}
#hotspots button{position:absolute;padding:0;margin:0;background:transparent;border:0;border-radius:8px;color:transparent;font-size:0;touch-action:manipulation}
#hotspots button:hover{background:#fff07}#hotspots button:active{background:#fff12}
nav{display:grid;gap:8px}nav button{text-align:left;color:#a0a0a0}nav button[aria-current=true]{background:#101010;color:#e8e8e8;border-color:#888888}
#status{height:auto;min-height:44px;line-height:1.5;font-size:14px;color:#a0a0a0;padding:14px 0}
.demo-switch{display:flex;align-items:center;gap:8px;color:#a0a0a0;font-size:14px}
details{margin-top:20px;border-top:1px solid #303030;padding-top:18px}summary{cursor:pointer;color:#a0a0a0}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;margin-top:20px}
figure{margin:0}figure img{width:100%;border:1px solid #303030;border-radius:8px}figcaption{font-size:14px;margin-bottom:8px;color:#a0a0a0}
a{color:#d0d0d0}@media(max-width:820px){body{padding:16px}#workspace{grid-template-columns:1fr}nav{grid-template-columns:repeat(3,1fr)}nav button{text-align:center;font-size:14px;padding:9px 5px}header{align-items:start}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<header><div><h1>Плоттер · DWIN + MKS</h1><p>Демонстрация. Откройте помощник или предпросмотр листа.</p></div><button id="restart">Показать включение</button></header>
<main id="workspace"><section><div id="panel"><canvas id="lcd" width="800" height="480" aria-label="Предпросмотр дисплея"></canvas><div id="hotspots"></div></div><div id="status" role="status" aria-live="polite">Заставка · 2 секунды, затем главное меню.</div></section><nav id="navigation" aria-label="Разделы"></nav></main>
<label class="demo-switch"><input id="demo-pc" type="checkbox" checked> В демо ПК отвечает</label>
<details><summary>Все экраны</summary><div id="gallery"></div></details>
<p>На настоящем дисплее заставка выполняется нативно, без ПК. Физическую загрузку и длительность ещё нужно проверить на панели.</p>
<script>
const manifest = __MANIFEST__;
const assistant=manifest.assistant,pg=assistant.pages,keys=assistant.keys;
const cv=document.getElementById('lcd'),ctx=cv.getContext('2d'),spots=document.getElementById('hotspots'),status=document.getElementById('status');
const state={4369:2,4368:0,4608:1,4609:50,4364:2,4367:1,4362:0,4370:1};
const numbers={4354:'12.50',4356:'48.00',4358:'210.00',4360:'297.00',4609:'50%',4363:'36%'};
let current=manifest.splash_page,timer=null,connectionTimer=null,pcReplyTimer=null,voiceTimer=null,question='',answer='';
function img(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Не удалось открыть '+src));im.src=src})}
const backgrounds=[],frames=[];
function draw(){
 ctx.clearRect(0,0,800,480);ctx.drawImage(backgrounds[current],0,0);
 for(const icon of manifest.icons.filter(x=>x.page===current)){
  const n=Number(state[icon.vp]??0);if(n>=0&&n<icon.labels.length)ctx.drawImage(frames[icon.first+n],icon.x,icon.y);
 }
 ctx.fillStyle='#e8e8e8';ctx.textAlign='center';ctx.textBaseline='top';
 for(const field of manifest.numeric_fields.filter(x=>x.page===current)){
  ctx.font=`${field.font_width*2}px Consolas,monospace`;
  const text=numbers[field.vp]??'0';[...text].forEach((c,i)=>ctx.fillText(c,field.rect[0]+(i+.5)*field.font_width,field.rect[1]));
 }
 if(current===pg.compose||current===pg.english)drawField(assistant.question,question.slice(-56));
 if(current===pg.wait)drawField(assistant.answer,answer);
 if(current===pg.preview&&state[assistant.preview.stage_vp]===2)drawSampleSheet();
}
function drawField(field,value){
 const [x,y]=field.rect,columns=28;
 ctx.font='21px Consolas,monospace';ctx.textAlign='center';ctx.textBaseline='top';
 [...value].slice(0,56).forEach((char,i)=>ctx.fillText(char,x+(i%columns+.5)*24,y+Math.floor(i/columns)*24));
}
function drawSampleSheet(){
 ctx.strokeStyle='#777';ctx.strokeRect(314,94,172,268);ctx.strokeStyle='#ededed';
 ctx.beginPath();
 ctx.moveTo(345,256);ctx.lineTo(357,216);ctx.lineTo(381,177);ctx.lineTo(419,177);
 ctx.lineTo(442,216);ctx.lineTo(456,256);ctx.closePath();ctx.stroke();
 ctx.beginPath();ctx.arc(400,231,17,0,Math.PI*2);ctx.stroke();
}
function demoAssistant(item){
 if(item.vp===assistant.keyboard_vp&&(item.key&0xf000)===assistant.keyboard_prefix){
  const char=item.key&0x0fff;
  if(char===8)question=question.slice(0,-1);
  else if(char===0x1B)question='';
  else question=(question+String.fromCodePoint(char)).slice(0,assistant.question.limit);
  draw();return true;
 }
 if(item.vp!==0x1000||!Object.values(keys).includes(item.key))return false;
 const stage=assistant.stage_vp,previewStage=assistant.preview.stage_vp;
 const responds=document.getElementById('demo-pc').checked;
 const finish=()=>{
  state[stage]=responds?5:6;
  answer=responds?'Рисунок подготовлен. Откройте предпросмотр листа.':'ПК не ответил. Проверьте подключение.';
  draw();
 };
 if(item.key===keys.english||item.key===keys.russian){
  show(item.key===keys.english?pg.english:pg.compose);return true;
 }
 if(item.key===keys.assistant||item.key===keys.cancel){
  clearTimeout(voiceTimer);question='';answer='';state[stage]=0;
  show(item.key===keys.assistant?pg.compose:manifest.home_page);return true;
 }
 if(item.key===keys.leave_preview){clearTimeout(voiceTimer);show(manifest.home_page);return true}
 if(item.key===keys.preview){
  clearTimeout(voiceTimer);state[previewStage]=1;show(pg.preview);
  voiceTimer=setTimeout(()=>{state[previewStage]=responds?2:3;draw()},350);return true;
 }
 if(item.key===keys.send&&question.trim()){
  clearTimeout(voiceTimer);answer='';state[stage]=1;show(pg.wait);
  voiceTimer=setTimeout(()=>{state[stage]=2;draw();voiceTimer=setTimeout(finish,750)},350);return true;
 }
 if(item.key===keys.voice){
  clearTimeout(voiceTimer);answer='';
  if(state[stage]===3){
   state[stage]=4;show(pg.wait);voiceTimer=setTimeout(finish,850);
  }else{
   state[stage]=1;show(pg.wait);
   voiceTimer=setTimeout(()=>{if(responds){state[stage]=3;draw()}else finish()},350);
  }
  return true;
 }
 return true;
}
function show(page){
 current=page;draw();spots.replaceChildren();
 for(const item of manifest.hotspots.filter(x=>x.page===page)){
  const b=document.createElement('button'),r=item.rect;b.type='button';b.title=item.text;b.setAttribute('aria-label',item.text.replace(/\n/g,' '));
  Object.assign(b.style,{left:r[0]/8+'%',top:r[1]/4.8+'%',width:(r[2]-r[0])/8+'%',height:(r[3]-r[1])/4.8+'%'});
  b.onclick=()=>activate(item);spots.append(b);
 }
 for(const b of document.querySelectorAll('#navigation button'))b.setAttribute('aria-current',String(Number(b.dataset.page)===page));
}
function activate(item){
 clearTimeout(timer);
 if(demoAssistant(item)){status.textContent='Демонстрация. Экран и станок не подключены.';return}
 if(item.key!==null){
  clearTimeout(pcReplyTimer);
  state[4368]=0;
  if(item.vp===manifest.pc_check.vp&&item.key===manifest.pc_check.key){
   const responds=document.getElementById('demo-pc').checked;
   state[4368]=manifest.pc_check.pending;
   status.textContent='Демонстрация: проверяю связь с ПК.';
   pcReplyTimer=setTimeout(()=>{
    state[4368]=responds?manifest.pc_check.answered:manifest.pc_check.timeout;
    status.textContent=responds?'Демонстрация: ПК ответил.':'Демонстрация: ПК не ответил.';
    draw();
   },responds?450:1800);
  }else{
   if(item.vp===4608)state[4608]=item.key;
   else if(item.vp===4609){state[4609]=item.key;numbers[4609]=item.key+'%'}
   else if(item.key===10)state[4364]=1;
   else if(item.key===11)state[4364]=2;
   else if(item.key===14){state[4364]=0;state[4368]=8}
   else if([12,13,15,16].includes(item.key))state[4368]=10;
   status.textContent='Демонстрация: «'+item.text.replace(/\n/g,' ')+'». '+(state[4368]===10?'MKS ожидает ответ программы.':'На станок ничего не отправлено.');
  }
 }
 else if(current===manifest.splash_page)status.textContent='Главное меню · показанные координаты — примеры.';
 show(item.target===null?current:item.target);
}
function boot(){
 clearTimeout(timer);clearTimeout(connectionTimer);clearTimeout(pcReplyTimer);clearTimeout(voiceTimer);
 question='';answer='';state[assistant.stage_vp]=0;state[assistant.preview.stage_vp]=0;
 const link=manifest.startup_connection.vp;state[link]=1;
 state[4368]=0;show(manifest.splash_page);status.textContent='Заставка · 2 секунды, затем главное меню.';
 timer=setTimeout(()=>{show(manifest.home_page);status.textContent='Можно нажимать кнопки. Показанные координаты — примеры, не измерения.'},manifest.splash_duration_ms);
 connectionTimer=setTimeout(()=>{state[link]=2;draw();
  connectionTimer=setTimeout(()=>{if(document.getElementById('demo-pc').checked){state[link]=3;draw()}},900);
 },manifest.splash_duration_ms+550);
}
async function start(){
 try{
  const loaded=await Promise.all([Promise.all(manifest.pages.map((_,i)=>img('backgrounds/'+String(i).padStart(3,'0')+'.png'))),Promise.all(Array.from({length:manifest.frames},(_,i)=>img('status-icons/'+String(i).padStart(3,'0')+'.png')))]);
  backgrounds.push(...loaded[0]);frames.push(...loaded[1]);
  for(const page of manifest.navigation_pages){const b=document.createElement('button');b.textContent=manifest.pages[page];b.dataset.page=page;b.onclick=()=>{clearTimeout(timer);show(page);status.textContent='Демонстрация интерфейса · команды станку не отправляются.'};document.getElementById('navigation').append(b)}
  for(const i of [manifest.splash_page,...manifest.operational_pages]){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),image=document.createElement('img');caption.textContent=manifest.pages[i];image.src='preview/'+String(i).padStart(2,'0')+'.png';image.alt=manifest.pages[i];image.loading='lazy';figure.append(caption,image);document.getElementById('gallery').append(figure)}
  document.getElementById('restart').onclick=boot;boot();
 }catch(e){status.textContent=e.message;status.style.color='#e0e0e0'}
}
start();
</script>
</html>
